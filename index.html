<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gaïa réunit les projets d'Astraeos : Céleste, l'observatoire astronomique pour Windows ; Ganymède, ses calculateurs et ses outils dans le navigateur ; les intégrations Home Assistant Céleste, Helios et Météo & Confort ; la bibliothèque astraeos-astro." />
    <meta name="theme-color" content="#0b0f17" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Gaïa — les projets d'Astraeos</title>
    <script>
      // Applique le thème (Jour, Nuit ou Observation) avant le premier rendu, pour éviter un flash.
      try {
        const stored = localStorage.getItem('theme');
        const theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme !== 'light');
        document.documentElement.classList.toggle('observation', theme === 'observation');
      } catch {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
