name: Vérification et déploiement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Chaque jour : les comètes, les géocroiseurs, les novae, les supernovae et les occultations se mettent à jour
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Comètes (MPC, COBS, JPL)
        run: node scripts/fetch-comets.mjs

      - name: Astéroïdes et planètes naines (JPL)
        run: node scripts/fetch-asteroids.mjs

      - name: Géocroiseurs (CNEOS et JPL Horizons)
        run: node scripts/fetch-neo.mjs

      - name: Novae et supernovae (David Bishop, Koji Mukai)
        run: node scripts/fetch-transients.mjs

      - name: Occultations d'étoiles par des astéroïdes (IOTA)
        run: node scripts/fetch-occultations.mjs

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Construction du site
        run: npm run build

      - name: Envoi du site construit
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publication sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
